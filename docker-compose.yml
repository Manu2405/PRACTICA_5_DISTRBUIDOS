services:
  cassandra:
    image: cassandra:4.1
    container_name: semapa-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=SemapaCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semapa-backend
    network_mode: host
    environment:
      - CASSANDRA_HOST=localhost
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./backend/recibos:/app/recibos
    restart: unless-stopped

  # API Go para AppRegistro (Expo Go) — puerto 8090
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: semapa-backend-go
    ports:
      - "8090:8090"
    environment:
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=semapa
      - APP_PORT=8090
      - JWT_SECRET=semapa-dev-secret
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semapa-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  visor:
    build:
      context: ./visor
      dockerfile: Dockerfile
    container_name: semapa-visor
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cassandra_data:
